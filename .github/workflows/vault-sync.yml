# ── NEXUS-AI-CORE · Vault Sync Workflow ─────────────────────────────────────
# Syncs GitHub Actions secrets → Vault on every push to main
# Also validates all required secrets are present before deploy

name: Vault Sync & Secret Validation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate only, no writes)"
        required: false
        default: "false"

jobs:
  validate-secrets:
    name: Validate All Integration Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install hvac python-dotenv

      - name: Validate secret presence
        env:
          # GitHub
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          # Slack
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL_ALERTS: ${{ secrets.SLACK_CHANNEL_ALERTS }}
          SLACK_CHANNEL_REVENUE: ${{ secrets.SLACK_CHANNEL_REVENUE }}
          # Base / Coinbase
          BASE_API_KEY: ${{ secrets.BASE_API_KEY }}
          BASE_PRIVATE_KEY: ${{ secrets.BASE_PRIVATE_KEY }}
          BASE_WALLET_ADDRESS: ${{ secrets.BASE_WALLET_ADDRESS }}
          CDP_API_KEY_NAME: ${{ secrets.CDP_API_KEY_NAME }}
          CDP_API_KEY_PRIVATE_KEY: ${{ secrets.CDP_API_KEY_PRIVATE_KEY }}
          # Shopify
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
          # Notion
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_AUDIT_DB_ID: ${{ secrets.NOTION_AUDIT_DB_ID }}
          NOTION_MEMORY_DB_ID: ${{ secrets.NOTION_MEMORY_DB_ID }}
          NOTION_REVENUE_DB_ID: ${{ secrets.NOTION_REVENUE_DB_ID }}
          NOTION_LEADS_DB_ID: ${{ secrets.NOTION_LEADS_DB_ID }}
          # Linear
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          LINEAR_PROJECT_ID: ${{ secrets.LINEAR_PROJECT_ID }}
          LINEAR_WEBHOOK_SECRET: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          # Hugging Face
          HUGGINGFACE_API_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
          # Stripe
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          # OpenAI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # SendGrid
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          # HubSpot
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          # DocuSign
          DOCUSIGN_INTEGRATION_KEY: ${{ secrets.DOCUSIGN_INTEGRATION_KEY }}
          DOCUSIGN_USER_ID: ${{ secrets.DOCUSIGN_USER_ID }}
          # Internal
          NEXUS_SECRET: ${{ secrets.NEXUS_SECRET }}
        run: |
          python - <<'EOF'
          import sys, os
          REQUIRED = [
            "GITHUB_TOKEN", "SLACK_BOT_TOKEN", "SLACK_SIGNING_SECRET",
            "BASE_API_KEY", "CDP_API_KEY_NAME",
            "SHOPIFY_ACCESS_TOKEN", "SHOPIFY_WEBHOOK_SECRET",
            "NOTION_API_KEY", "LINEAR_API_KEY",
            "SUPABASE_URL", "SUPABASE_SERVICE_ROLE_KEY",
            "HUGGINGFACE_API_TOKEN", "STRIPE_SECRET_KEY",
            "OPENAI_API_KEY", "NEXUS_SECRET"
          ]
          missing = [k for k in REQUIRED if not os.getenv(k)]
          if missing:
            print(f"❌ MISSING SECRETS: {missing}")
            sys.exit(1)
          print(f"✅ All {len(REQUIRED)} required secrets validated.")
          EOF

  vault-seed:
    name: Seed Vault from GitHub Secrets
    runs-on: ubuntu-latest
    needs: validate-secrets
    if: github.event.inputs.dry_run != 'true' && vars.VAULT_ADDR != ''
    steps:
      - uses: actions/checkout@v4

      - name: Install hvac
        run: pip install hvac

      - name: Seed Vault
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_ROLE_ID: ${{ secrets.VAULT_ROLE_ID }}
          VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}
          # --- all integration secrets ---
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL_ALERTS: ${{ secrets.SLACK_CHANNEL_ALERTS }}
          SLACK_CHANNEL_REVENUE: ${{ secrets.SLACK_CHANNEL_REVENUE }}
          BASE_API_KEY: ${{ secrets.BASE_API_KEY }}
          BASE_PRIVATE_KEY: ${{ secrets.BASE_PRIVATE_KEY }}
          BASE_WALLET_ADDRESS: ${{ secrets.BASE_WALLET_ADDRESS }}
          CDP_API_KEY_NAME: ${{ secrets.CDP_API_KEY_NAME }}
          CDP_API_KEY_PRIVATE_KEY: ${{ secrets.CDP_API_KEY_PRIVATE_KEY }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_WEBHOOK_SECRET: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_AUDIT_DB_ID: ${{ secrets.NOTION_AUDIT_DB_ID }}
          NOTION_MEMORY_DB_ID: ${{ secrets.NOTION_MEMORY_DB_ID }}
          NOTION_REVENUE_DB_ID: ${{ secrets.NOTION_REVENUE_DB_ID }}
          NOTION_LEADS_DB_ID: ${{ secrets.NOTION_LEADS_DB_ID }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
          LINEAR_PROJECT_ID: ${{ secrets.LINEAR_PROJECT_ID }}
          LINEAR_WEBHOOK_SECRET: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          HUGGINGFACE_API_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          DOCUSIGN_INTEGRATION_KEY: ${{ secrets.DOCUSIGN_INTEGRATION_KEY }}
          NEXUS_SECRET: ${{ secrets.NEXUS_SECRET }}
        run: bash secrets/vault_seed.sh

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"text":"✅ *NEXUS-AI-CORE* — Vault secrets synced successfully on push to main."}'

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"text":"🚨 *NEXUS-AI-CORE* — Vault sync FAILED. Check GitHub Actions logs immediately."}'
