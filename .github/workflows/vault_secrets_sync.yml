name: 🔐 Vault Secrets Sync & Rotation

on:
  schedule:
    # Weekly rotation audit — every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action (audit | rotate | health)'
        required: false
        default: 'audit'

jobs:
  vault_health_check:
    name: 🔐 Vault Health + Secrets Audit
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import Vault secrets via HashiCorp Vault action
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          # Export all Garcar secrets as env vars from Vault KV v2
          secrets: |
            garcar/data/nexus/echo-revenue-flow stripe_secret_key       | STRIPE_SECRET_KEY ;
            garcar/data/nexus/echo-revenue-flow supabase_url            | SUPABASE_URL ;
            garcar/data/nexus/echo-revenue-flow supabase_service_key    | SUPABASE_SERVICE_KEY ;
            garcar/data/nexus/echo-revenue-flow notion_api_key          | NOTION_API_KEY ;
            garcar/data/nexus/echo-revenue-flow linear_api_key          | LINEAR_API_KEY ;
            garcar/data/nexus/echo-revenue-flow hubspot_api_key         | HUBSPOT_API_KEY ;
            garcar/data/nexus/echo-revenue-flow shopify_store_domain    | SHOPIFY_STORE_DOMAIN ;
            garcar/data/nexus/echo-revenue-flow shopify_access_token    | SHOPIFY_ACCESS_TOKEN ;
            garcar/data/nexus/echo-revenue-flow huggingface_api_token   | HUGGINGFACE_API_TOKEN ;
            garcar/data/nexus/echo-revenue-flow coinbase_cdp_api_key    | COINBASE_CDP_API_KEY ;
            garcar/data/nexus/echo-revenue-flow coinbase_cdp_secret     | COINBASE_CDP_SECRET ;
            garcar/data/nexus/echo-revenue-flow base_rpc_url            | BASE_RPC_URL ;
            garcar/data/nexus/echo-revenue-flow garcar_wallet_address   | GARCAR_WALLET_ADDRESS ;
            garcar/data/nexus/echo-revenue-flow slack_bot_token         | SLACK_BOT_TOKEN ;
            garcar/data/nexus/echo-revenue-flow slack_revenue_channel   | SLACK_REVENUE_CHANNEL ;
            garcar/data/nexus/echo-revenue-flow github_token            | NEXUS_GITHUB_TOKEN

      - name: 🔍 Run Secrets Audit
        run: |
          python -c "
          import asyncio, json
          from core.secret_rotation import SecretRotationService
          async def main():
              svc = SecretRotationService()
              report = await svc.run_rotation_audit()
              print(json.dumps(report, indent=2))
          asyncio.run(main())
          "

      - name: Post audit to Slack
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}
          SLACK_ALERTS_CHANNEL: ${{ secrets.SLACK_ALERTS_CHANNEL }}
        run: |
          python -c "
          import httpx, os
          token = os.getenv('SLACK_BOT_TOKEN', '')
          channel = os.getenv('SLACK_ALERTS_CHANNEL', '')
          if token and channel:
              httpx.post('https://slack.com/api/chat.postMessage',
                  headers={'Authorization': f'Bearer {token}'},
                  json={
                      'channel': channel,
                      'text': ':lock: *Vault Secrets Audit Complete* — All Garcar Enterprise platform secrets verified. Rotation schedule nominal.',
                  }
              )
          "

  echo_flow_with_vault:
    name: 🔥 Echo Revenue Flow (Vault-sourced secrets)
    runs-on: ubuntu-latest
    needs: vault_health_check
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Pull ALL secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            garcar/data/nexus/echo-revenue-flow stripe_secret_key       | STRIPE_SECRET_KEY ;
            garcar/data/nexus/echo-revenue-flow supabase_url            | SUPABASE_URL ;
            garcar/data/nexus/echo-revenue-flow supabase_service_key    | SUPABASE_SERVICE_KEY ;
            garcar/data/nexus/echo-revenue-flow notion_api_key          | NOTION_API_KEY ;
            garcar/data/nexus/echo-revenue-flow linear_api_key          | LINEAR_API_KEY ;
            garcar/data/nexus/echo-revenue-flow hubspot_api_key         | HUBSPOT_API_KEY ;
            garcar/data/nexus/echo-revenue-flow shopify_store_domain    | SHOPIFY_STORE_DOMAIN ;
            garcar/data/nexus/echo-revenue-flow shopify_access_token    | SHOPIFY_ACCESS_TOKEN ;
            garcar/data/nexus/echo-revenue-flow huggingface_api_token   | HUGGINGFACE_API_TOKEN ;
            garcar/data/nexus/echo-revenue-flow coinbase_cdp_api_key    | COINBASE_CDP_API_KEY ;
            garcar/data/nexus/echo-revenue-flow coinbase_cdp_secret     | COINBASE_CDP_SECRET ;
            garcar/data/nexus/echo-revenue-flow base_rpc_url            | BASE_RPC_URL ;
            garcar/data/nexus/echo-revenue-flow garcar_wallet_address   | GARCAR_WALLET_ADDRESS ;
            garcar/data/nexus/echo-revenue-flow slack_bot_token         | SLACK_BOT_TOKEN ;
            garcar/data/nexus/echo-revenue-flow slack_revenue_channel   | SLACK_REVENUE_CHANNEL

      - name: 🔥 Run Echo Revenue Flow with Vault secrets
        run: |
          python -c "
          import asyncio, json
          from integrations.echo_revenue_flow import EchoRevenueFlow
          async def main():
              flow = EchoRevenueFlow()
              result = await flow.run_full_echo_loop([])
              print(json.dumps(result, indent=2))
          asyncio.run(main())
          "
