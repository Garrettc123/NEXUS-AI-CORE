name: Vault Secrets (NEXUS)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require VAULT_ADDR
        run: |
          if [ -z "${{ env.VAULT_ADDR }}" ]; then
            echo "::error::Set VAULT_ADDR repository secret"
            exit 1
          fi

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v3.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: garcar-github-actions
          secrets: |
            secret/data/garcar/ai * ;
            secret/data/garcar/stripe * ;
            secret/data/garcar/github * ;
            secret/data/garcar/slack * ;
            secret/data/garcar/supabase * ;
            secret/data/garcar/enrichment * ;
            secret/data/garcar/infra * ;

      - name: Verify critical keys
        run: |
          for var in ANTHROPIC_API_KEY STRIPE_SECRET_KEY GITHUB_TOKEN; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing $var"
              exit 1
            fi
            echo "✅ $var"
          done
